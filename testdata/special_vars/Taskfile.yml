version: '3'

includes:
  included:
    taskfile: ./included
    dir: ./included

tasks:
  print-task:
    aliases: [echo-task]
    cmds:
      - echo {{.TASK}}
  print-root-dir: echo {{.ROOT_DIR}}
  print-root-taskfile: echo {{.ROOT_TASKFILE}}
  print-taskfile: echo {{.TASKFILE}}
  print-taskfile-dir: echo {{.TASKFILE_DIR}}
  print-task-version: echo {{.TASK_VERSION}}
  print-task-alias:
    aliases: [echo-task-alias]
    cmds:
      - echo "{{.ALIAS}}"
  print-task-alias-default: echo "{{.ALIAS}}"
  print-task-dir:
    dir: 'foo'
    cmd: echo {{.TASK_DIR}}
  print-task-file-lists:
    dir: sources-as-var
    sources:
      - '**/*.txt'
      - exclude: ignored.txt
      - does-not-exist-*.txt
    generates:
      - generated/*.generated
      - generated/does-not-exist-*.generated
    cmds:
      - for: { var: TASK_SOURCES }
        cmd: printf '<%s>\n' '{{.ITEM}}'
      - echo '---'
      - for: { var: TASK_GENERATES }
        cmd: printf '<%s>\n' '{{.ITEM}}'
