version: '3'

includes:
  included:
    taskfile: ./included/Taskfile.yml
    excludes:
      - foo
      - namespace
  included_flatten:
    taskfile: ./included/Taskfile.yml
    flatten: true
    excludes:
      - bar
      - namespace:*

tasks:
  default:
    cmds:
      - echo "called_dep" > called_dep.txt
