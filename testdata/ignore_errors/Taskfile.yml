version: '3'

tasks:
  task-should-pass:
    cmds:
      - exit 1
    ignore_error: true

  task-should-fail:
    cmds:
      - exit 1

  cmd-should-pass:
    cmds:
      - cmd: exit 1
        ignore_error: true

  cmd-should-fail:
    cmds:
      - cmd: exit 1

  task-timeout-should-pass:
    cmds:
      - cmd: sleep 10
        timeout: 200ms
      - echo "reached the end"
    ignore_error: true

  cmd-timeout-should-pass:
    cmds:
      - cmd: sleep 10
        timeout: 200ms
        ignore_error: true
      - echo "reached the end"

  cmd-timeout-should-fail:
    cmds:
      - cmd: sleep 10
        timeout: 200ms
      - echo "reached the end"
