version: 3

tasks:
  wildcard-*:
    cmds:
      - echo "Hello {{index .MATCH 0}}"

  wildcard-*-*:
    cmds:
      - echo "Hello {{index .MATCH 0}}"

  '*-wildcard-*':
    cmds:
      - echo "Hello {{index .MATCH 0}} {{index .MATCH 1}}"

  # Matches is empty when you call the task name exactly (i.e. `task matches-exactly-*`)
  matches-exactly-*:
    cmds:
      - "echo \"I don't consume matches: {{.MATCH}}\""

  start-*:
    aliases:
      - s-*
    vars:
      SERVICE: "{{index .MATCH 0}}"
    cmds:
      - echo "Starting {{.SERVICE}}"

  # Regex metacharacters in a task name must be matched literally
  c++:
    cmds:
      - echo "Building c++"

  deploy.prod:
    cmds:
      - echo "Deploying prod"
