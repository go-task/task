name: CI

on:
  pull_request:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-actions-lock:
    name: 🔒 Verify actions lockfile
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: ⬇️ Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🔒 Verify actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: 🔨 Build (${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: 🔨 Build
        run: go build -v ./cmd/task

  test:
    name: 🧪 Test (${{ matrix.go-version }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: ⬇️ Setup Task
        uses: go-task/setup-task@v2.2.0

      - name: 🧪 Test
        run: task test --output group --output-group-begin '::group::{{.TASK}}' --output-group-end '::endgroup::'

  completion:
    name: 🐚 Completion (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: ⬇️ Setup Task
        uses: go-task/setup-task@v2.2.0

      # zsh and pwsh are preinstalled on the runners; only fish is missing
      # (plus zsh on the Linux image).
      - name: ⬇️ Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: ⬇️ Install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      # Nushell ships in no runner image and is not packaged by apt, so it comes
      # from its own release archives.
      - name: ⬇️ Install Nushell
        uses: hustcer/setup-nu@v3.28
        with:
          version: "*"

      - name: 🧪 Test completion
        # Strict mode fails the run if any shell is missing, so we never get a
        # false pass when a runner image stops shipping one (e.g. pwsh).
        env:
          TASK_COMPLETION_STRICT: "1"
        run: task test:completion

  lint:
    name: 🔍 Lint (${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: 🔍 Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  lint-jsonschema:
    name: 📋 Lint JSON Schema
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.15

      - name: ⬇️ Install check-jsonschema
        run: python -m pip install 'check-jsonschema==0.27.3'

      - name: 📋 Validate JSON Schema
        run: check-jsonschema --check-metaschema website/src/public/next-schema.json website/src/public/schema.json

  website:
    name: 📚 Build documentation channels
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: ⬇️ Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: ⬇️ Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: ⬇️ Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: website/package.json

      - name: ⬇️ Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: 📚 Check next documentation
        run: pnpm build && pnpm check:links
        working-directory: website
        env:
          DOCS_CHANNEL: next
          DOCS_SITE: preview

      - name: 📚 Check released documentation
        run: pnpm build && pnpm check:links
        working-directory: website
        env:
          DOCS_CHANNEL: latest
          DOCS_SITE: production

      # Exercise the actual promotion in this disposable checkout. The current
      # latest content alone cannot reveal links to files missing from promotion.
      - name: 📚 Simulate a release
        run: go run ./cmd/release patch

      - name: 📚 Check promoted documentation
        run: pnpm build && pnpm check:links
        working-directory: website
        env:
          DOCS_CHANNEL: latest
          DOCS_SITE: production

  check-latest-content:
    name: 📚 Check latest content
    # Pull requests only: the release commit is pushed straight to main and is
    # the one thing allowed to rewrite these files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            // Everything cmd/release overwrites. Adding a file is fine -- that
            // is how a blog post gets published early -- editing one is not.
            const generated = (name) =>
              name.startsWith('website/src/latest/') ||
              name === 'website/src/public/schema.json' ||
              name === 'website/src/public/schema-taskrc.json' ||
              name === 'website/.vitepress/sidebar/latest.ts'

            const files = await github.paginate(
              github.rest.pulls.listFiles, {
                pull_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            )
            const edited = files.filter(
              (f) => generated(f.filename) && f.status !== 'added'
            )
            if (edited.length > 0) {
              core.setFailed(
                'These files are generated by cmd/release and would be overwritten at the next release. Update their website/src counterpart instead:\n' +
                  edited.map((f) => f.filename).join('\n')
              )
            }

  govulncheck:
    name: 🛡️ Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1.1.0
